<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Book details</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <p><a href="/">&larr; Back to authors</a></p>
  <h1 id="title">Book details</h1>
  <p id="status"></p>
  <p id="actions" hidden>
    <button id="edit" type="button">Edit</button>
    <button id="delete" type="button">Delete</button>
  </p>
  <img id="cover" alt="Book cover" hidden>
  <div id="overlay"><img id="full" alt="Full size book cover"></div>
  <dl id="details"></dl>
  <form id="edit-form" hidden>
    <div id="edit-fields"></div>
    <button id="save" type="submit">Save changes</button>
    <button id="cancel-edit" type="button">Cancel</button>
  </form>

  <script src="/static/book.js"></script>
</body>
</html>

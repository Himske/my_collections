[project]
name = "rpcats"
version = "0.1.0"
description = "Book collection"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "annotated-types==0.7.0",
    "anyio==4.6.2.post1",
    "certifi==2024.8.30",
    "click==8.1.7",
    "colorama==0.4.6",
    "dnspython==2.7.0",
    "email-validator==2.2.0",
    "fastapi==0.115.4",
    "fastapi-cli==0.0.5",
    "greenlet==3.1.1",
    "h11==0.14.0",
    "httpcore==1.0.6",
    "httptools==0.6.4",
    "httpx==0.27.2",
    "idna==3.10",
    "jinja2==3.1.4",
    "markdown-it-py==3.0.0",
    "markupsafe==3.0.2",
    "mdurl==0.1.2",
    "numpy==2.1.3",
    "pandas==2.2.3",
    "polars==1.12.0",
    "pydantic==2.9.2",
    "pydantic-ai>=0.0.2",
    "pydantic-core==2.23.4",
    "pygments==2.18.0",
    "python-dateutil==2.9.0.post0",
    "python-dotenv==1.0.1",
    "python-multipart==0.0.17",
    "pytz==2024.2",
    "pyyaml==6.0.2",
    "rich==13.9.3",
    "shellingham==1.5.4",
    "six==1.16.0",
    "sniffio==1.3.1",
    "sqlalchemy==2.0.36",
    "sqlmodel==0.0.22",
    "starlette==0.41.2",
    "typer==0.12.5",
    "typing-extensions==4.12.2",
    "tzdata==2024.2",
    "uvicorn==0.32.0",
    "watchfiles==0.24.0",
    "websockets==13.1",
]
[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = ["venv", ".venv", ".ruff_cache", ".git"]
# Enable the pycodestyle (`E`) and Pyflakes (`F`) rules by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
select = ["E", "F"]
extend-select = ["C4", "SIM", "TCH"]
ignore = []
show-fixes = true
line-length = 119
[tool.black]
line-length = 119
